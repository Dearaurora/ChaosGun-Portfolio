<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ChaosGun — 45 秒 Demo</title>
  <meta name="description" content="ChaosGun 2.5D 多人派对射击游戏 45 秒有声 Demo。">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111d;
      color: #fff8df;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
      background:
        radial-gradient(circle at 78% 12%, rgba(255, 96, 102, .24), transparent 32%),
        radial-gradient(circle at 20% 30%, rgba(102, 49, 255, .3), transparent 36%),
        #07111d;
    }

    main {
      width: min(1120px, 100%);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #ffd43b;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    .summary {
      margin: 14px 0 24px;
      color: #cbd5e1;
      font-size: clamp(15px, 2vw, 19px);
      line-height: 1.65;
    }

    .player {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 18px;
      background: #02070d;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .48);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #02070d;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 14px;
    }

    .meta a {
      color: #fff8df;
      text-decoration-color: #ffd43b;
      text-underline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ChaosGun · Gameplay Demo</p>
    <h1>击退，而不是击杀</h1>
    <p class="summary">45 秒了解三张竞技场、核心击退玩法，以及动态武器与地图机制。点击画面中央即可播放有声视频。</p>

    <div class="player">
      <video
        controls
        playsinline
        preload="metadata"
        poster="ChaosGun_Demo_Cover.jpg"
        aria-label="ChaosGun 45 秒有声 Demo"
      >
        <source src="ChaosGun_Demo_Final.mp4" type="video/mp4">
        你的浏览器不支持 HTML5 视频，请使用现代浏览器打开。
      </video>
    </div>

    <div class="meta">
      <span>00:45 · 1280×720 · 有声</span>
      <a href="https://github.com/Dearaurora/ChaosGun-Portfolio">返回 GitHub 项目介绍</a>
    </div>
  </main>
</body>
</html>
